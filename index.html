<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신부 뽑기</title>
<style>
  :root {
    --bg: #FFE9F0;
    --bg-deep: #FFD6E4;
    --card: #FFF9F4;
    --ink: #4A2B3A;
    --ink-soft: #8A6275;
    --pink: #FF4D8D;
    --pink-deep: #E23673;
    --gold: #E4A93C;
    --gold-soft: #F6D488;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.7), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,183,214,.55), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    overflow-x: hidden;
  }

  .stage {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 32px 20px 48px;
    position: relative;
  }

  /* ---------- header ---------- */
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--pink-deep);
    background: rgba(255,255,255,.65);
    border: 1.5px solid rgba(255,77,141,.35);
    border-radius: 999px;
    padding: 6px 16px 6px 19px;
    margin: 0 0 14px;
  }

  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 900;
    margin: 0;
    text-align: center;
    text-wrap: balance;
    letter-spacing: -.02em;
    line-height: 1.2;
  }
  h1 .accent { color: var(--pink); }

  .sub {
    margin: 10px 0 0;
    font-size: 15px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---------- gift box scene ---------- */
  .box-scene {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .gift-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 46px 0;
    cursor: pointer;
    border: 0;
    background: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .gift-wrap:focus-visible { outline: 3px dashed var(--pink); outline-offset: 8px; border-radius: 20px; }

  .giftbox {
    position: relative;
    width: 170px;
    height: 150px;
    animation: floaty 2.6s ease-in-out infinite;
    transform-origin: 50% 100%;
    pointer-events: none;
  }
  .gift-wrap:hover .giftbox { animation: wiggle .5s ease-in-out infinite; }
  .giftbox.shaking { animation: bigshake .12s linear infinite; }

  .box-body {
    position: absolute;
    left: 10px; right: 10px; bottom: 0;
    height: 96px;
    background: linear-gradient(180deg, #FF7FB0 0%, #FF5C97 55%, #F04585 100%);
    border-radius: 10px 10px 14px 14px;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08), 0 14px 24px rgba(226,54,115,.35);
  }
  .box-body::before {
    content: "";
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 26px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .box-lid {
    position: absolute;
    left: 0; right: 0; top: 34px;
    height: 34px;
    background: linear-gradient(180deg, #FF97BF 0%, #FF6FA5 100%);
    border-radius: 8px;
    box-shadow: 0 4px 0 rgba(0,0,0,.07);
    z-index: 2;
  }
  .box-lid::before {
    content: "";
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 26px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  }
  .bow {
    position: absolute;
    left: 50%; top: 14px;
    transform: translateX(-50%);
    z-index: 3;
    width: 70px; height: 34px;
  }
  .bow::before, .bow::after {
    content: "";
    position: absolute;
    top: 4px;
    width: 30px; height: 24px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .bow::before { left: 0; transform: rotate(-24deg); }
  .bow::after { right: 0; transform: rotate(24deg); }
  .bow-knot {
    position: absolute;
    left: 50%; top: 9px;
    transform: translateX(-50%);
    width: 18px; height: 18px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.45);
    z-index: 4;
  }

  .sparkle {
    position: absolute;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(246,212,136,.9);
    animation: twinkle 1.6s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
  }

  .pedestal {
    width: 230px;
    height: 16px;
    border-radius: 50%;
    background: rgba(226,54,115,.16);
    filter: blur(2px);
    margin-top: -10px;
    pointer-events: none;
  }

  .hint {
    font-size: 15px;
    font-weight: 700;
    color: var(--pink-deep);
    background: #fff;
    border-radius: 999px;
    padding: 10px 22px;
    box-shadow: 0 6px 16px rgba(226,54,115,.18);
    animation: bob 1.4s ease-in-out infinite;
  }

  /* ---------- result card ---------- */
  .card-scene {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }
  .card-scene[hidden] { display: none; }

  .card {
    width: min(360px, 92vw);
    background: var(--card);
    border-radius: 26px;
    padding: 26px 26px 30px;
    text-align: center;
    box-shadow: 0 24px 50px rgba(180,60,110,.25), inset 0 0 0 1.5px rgba(255,77,141,.15);
    animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both;
    position: relative;
  }
  .card.ssr {
    box-shadow: 0 24px 50px rgba(180,60,110,.3), inset 0 0 0 2.5px var(--gold);
  }

  .rarity {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .18em;
    border-radius: 999px;
    padding: 5px 14px 5px 16px;
    margin-bottom: 14px;
  }
  .rarity.n   { background: #EFE6E0; color: #8A7466; }
  .rarity.r   { background: #E1EDFF; color: #3D6FC2; }
  .rarity.sr  { background: #F0E4FF; color: #8A4DD0; }
  .rarity.ssr { background: linear-gradient(90deg, #F9E2A8, #F2C453); color: #7A5410; }

  /* ---------- bride figure: veil + head + gown ---------- */
  .bride {
    position: relative;
    width: 190px;
    height: 210px;
    margin: 0 auto 6px;
  }
  .bride::before {
    content: "";
    position: absolute;
    left: 50%; top: 47%;
    transform: translate(-50%, -50%);
    width: 180px; height: 200px;
    background: linear-gradient(180deg, #FFD9E8 0%, #FFC7DC 100%);
    border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
    box-shadow: inset 0 -8px 16px rgba(226,54,115,.12);
  }
  .card.ssr .bride::before {
    background: linear-gradient(180deg, #FBDFA9 0%, #F6C97F 100%);
    box-shadow: inset 0 -8px 16px rgba(160,110,20,.18);
  }
  .veil {
    position: absolute;
    left: 50%; top: 2px;
    transform: translateX(-50%);
    width: 150px; height: 168px;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.25));
    border-radius: 75px 75px 26px 26px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.7);
  }
  .tiara {
    position: absolute;
    left: 50%; top: -10px;
    transform: translateX(-50%);
    font-size: 22px;
    z-index: 6;
  }
  .gown {
    position: absolute;
    left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 156px; height: 110px;
    background: linear-gradient(180deg, #FFFFFF 0%, #FDF3F0 100%);
    clip-path: polygon(50% 0%, 66% 8%, 88% 86%, 96% 100%, 4% 100%, 12% 86%, 34% 8%);
    z-index: 2;
    filter: drop-shadow(0 6px 10px rgba(180,60,110,.18));
  }
  .gown::after {
    content: "";
    position: absolute;
    left: 50%; top: 16px;
    transform: translateX(-50%);
    width: 44px; height: 22px;
    background: rgba(255,192,216,.55);
    border-radius: 0 0 22px 22px;
  }
  .gown.gold { background: linear-gradient(180deg, #FFFDF4 0%, #FBEBC4 100%); }
  .gown.rose { background: linear-gradient(180deg, #FFF0F6 0%, #FFD3E4 100%); }
  .bouquet {
    position: absolute;
    left: 50%; bottom: 46px;
    transform: translateX(-50%);
    font-size: 30px;
    z-index: 5;
  }

  /* ===== head: 두더지 두덕순 ===== */
  .mole-head {
    position: absolute;
    left: 50%; top: 18px;
    transform: translateX(-50%);
    z-index: 3;
    width: 80px; height: 68px;
    background: linear-gradient(180deg, #96674F 0%, #7C5240 100%);
    border-radius: 52% 52% 46% 46%;
  }
  .mole-head .eye {
    position: absolute;
    top: 26px;
    width: 14px; height: 7px;
    border-bottom: 3px solid #3A2418;
    border-radius: 0 0 14px 14px;
  }
  .mole-head .eye.l { left: 14px; }
  .mole-head .eye.r { right: 14px; }
  .mole-head .snout {
    position: absolute;
    left: 50%; top: 30px;
    transform: translateX(-50%);
    width: 22px; height: 15px;
    background: #F79BB6;
    border-radius: 50%;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .mole-head .teeth {
    position: absolute;
    left: 50%; top: 43px;
    transform: translateX(-50%);
    width: 16px; height: 10px;
    background: #FFF;
    border-radius: 0 0 4px 4px;
  }
  .mole-head .teeth::after {
    content: "";
    position: absolute;
    left: 50%; top: 0;
    width: 1.5px; height: 100%;
    background: #D8C4B4;
  }
  .mole-head .blush {
    position: absolute;
    top: 38px;
    width: 12px; height: 7px;
    background: rgba(255,128,168,.55);
    border-radius: 50%;
  }
  .mole-head .blush.l { left: 7px; }
  .mole-head .blush.r { right: 7px; }

  /* ===== head: 로켓단st 로사린 ===== */
  .rocket-head {
    position: absolute;
    left: 50%; top: 16px;
    transform: translateX(-50%);
    z-index: 3;
    width: 84px; height: 72px;
  }
  .rocket-head .r-hair {
    position: absolute;
    left: -88px; top: -30px;
    width: 196px; height: 58px;
    background: linear-gradient(180deg, #C2185B 0%, #8E0F45 100%);
    border-radius: 2% 100% 0 85% / 30% 100% 0 100%;
    transform: rotate(-14deg);
  }
  .rocket-head .r-hair::after {
    content: "";
    position: absolute;
    left: -6px; top: 32px;
    width: 46px; height: 40px;
    background: #A81450;
    border-radius: 0 12% 100% 88% / 0 30% 100% 88%;
    transform: rotate(10deg);
  }
  .rocket-head .r-fringe {
    position: absolute;
    left: 5px; top: -10px;
    width: 78px; height: 32px;
    background: linear-gradient(180deg, #CE2A68 0%, #A31352 100%);
    border-radius: 40px 40px 34% 55%;
  }
  .rocket-head .r-face {
    position: absolute;
    left: 50%; top: 8px;
    transform: translateX(-50%);
    width: 60px; height: 60px;
    background: linear-gradient(180deg, #FFE7D4 0%, #FFDCC2 100%);
    border-radius: 50% 50% 46% 46%;
  }
  .rocket-head .r-face .eye {
    position: absolute;
    top: 22px;
    width: 9px; height: 13px;
    background: radial-gradient(circle at 35% 30%, #6E93E0 0 35%, #2F5FC4);
    border-radius: 50%;
  }
  .rocket-head .r-face .eye.l { left: 13px; }
  .rocket-head .r-face .eye.r { right: 13px; }
  .rocket-head .r-face .eye::after {
    content: "";
    position: absolute;
    left: 2px; top: 2px;
    width: 3px; height: 4px;
    background: #FFF;
    border-radius: 50%;
  }
  .rocket-head .r-face .lash {
    position: absolute;
    top: 18px;
    width: 12px; height: 4px;
    border-top: 2.5px solid #7A3555;
    border-radius: 50%;
  }
  .rocket-head .r-face .lash.l { left: 11px; transform: rotate(-8deg); }
  .rocket-head .r-face .lash.r { right: 11px; transform: rotate(8deg); }
  .rocket-head .r-face .mouth {
    position: absolute;
    left: 50%; top: 39px;
    transform: translateX(-50%);
    width: 13px; height: 10px;
    background: #C24868;
    border-radius: 2px 2px 12px 12px;
  }
  .rocket-head .r-face .ear-ring {
    position: absolute;
    top: 30px;
    width: 8px; height: 8px;
    background: #57A84F;
    border-radius: 50%;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5);
  }
  .rocket-head .r-face .ear-ring.l { left: -4px; }
  .rocket-head .r-face .ear-ring.r { right: -4px; }

  /* ===== head: 세쌍둥이 두더지 디그순 자매 ===== */
  .trio {
    position: absolute;
    left: 50%; top: 4px;
    transform: translateX(-50%);
    z-index: 3;
    width: 140px; height: 100px;
  }
  .trio .dig {
    position: absolute;
    width: 46px; height: 64px;
    background: linear-gradient(180deg, #9A6A4F 0%, #7E5138 100%);
    border-radius: 23px 23px 10px 10px;
  }
  .trio .dig::before {
    content: "";
    position: absolute;
    top: -9px; left: -6px; right: -6px;
    height: 26px;
    background: linear-gradient(180deg, #F7DA66 0%, #EFC93F 100%);
    border-radius: 20px 20px 14px 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,.06);
  }
  .trio .dig.a { left: 47px; top: 0; z-index: 1; height: 68px; }
  .trio .dig.b { left: 10px; top: 28px; z-index: 2; box-shadow: 0 0 0 3px var(--card); }
  .trio .dig.c { right: 10px; top: 32px; z-index: 2; box-shadow: 0 0 0 3px var(--card); }
  .trio .dig.c::before { border-radius: 20px 20px 4px 18px; transform: rotate(4deg); }
  .trio .dig .e {
    position: absolute;
    top: 28px;
    width: 5px; height: 8px;
    background: #2E1C10;
    border-radius: 50%;
  }
  .trio .dig .e.l { left: 11px; }
  .trio .dig .e.r { right: 11px; }
  .trio .dig .nose {
    position: absolute;
    left: 50%; top: 38px;
    transform: translateX(-50%);
    width: 13px; height: 10px;
    background: #F79BB6;
    border-radius: 50%;
  }

  /* ===== head: 불닭st 호치롱 ===== */
  .chick-head {
    position: absolute;
    left: 50%; top: 10px;
    transform: translateX(-50%);
    z-index: 3;
    width: 86px; height: 80px;
    background: #FFFFFF;
    border-radius: 50% 50% 47% 47%;
    box-shadow: inset 0 0 0 2.2px #2A2A2A;
  }
  .chick-head .comb {
    position: absolute;
    left: 50%; top: -16px;
    transform: translateX(-50%);
    width: 13px; height: 15px;
    background: #E22B2B;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    box-shadow: -10px 7px 0 -1px #E22B2B, 10px 7px 0 -1px #F7B500;
  }
  .chick-head .bang {
    position: absolute;
    top: 5px; left: 8px; right: 8px;
    height: 30px;
    background: repeating-linear-gradient(90deg, #20386B 0 10px, #17294E 10px 12px);
    border-radius: 42px 42px 4px 4px;
    box-shadow: 0 2px 0 rgba(0,0,0,.12);
  }
  .chick-head .eye {
    position: absolute;
    top: 42px;
    width: 19px; height: 11px;
    background: #FFF;
    border: 2px solid #1E1E1E;
    border-radius: 50%;
    overflow: hidden;
  }
  .chick-head .eye::after {
    content: "";
    position: absolute;
    left: -2px; right: -2px; top: -2px;
    height: 6px;
    background: #1E1E1E;
  }
  .chick-head .eye.l { left: 10px; }
  .chick-head .eye.r { right: 10px; }
  .chick-head .beak {
    position: absolute;
    left: 50%; top: 50px;
    transform: translateX(-50%);
    width: 16px; height: 12px;
    background: linear-gradient(180deg, #F7B500 50%, #E89C00 50%);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .chick-head .heart {
    position: absolute;
    left: 50%; top: 63px;
    transform: translateX(-50%);
    font-size: 11px;
    line-height: 1;
    color: #E22B2B;
  }
  .chick-head .swirl {
    position: absolute;
    top: 49px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%, #F07818 0 1.7px, rgba(240,120,24,0) 1.7px 4.4px);
  }
  .chick-head .swirl.l { left: 2px; }
  .chick-head .swirl.r { right: 2px; }

  /* 로사린 드레스의 R 로고 */
  .r-logo {
    position: absolute;
    left: 50%; bottom: 80px;
    transform: translateX(-50%);
    z-index: 3;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 900;
    font-size: 25px;
    line-height: 1;
    color: #E23B3B;
    text-shadow: 1px 1px 0 rgba(0,0,0,.1);
  }

  /* ===== head: 아이돌 아짱 ===== */
  .idol {
    position: absolute;
    left: 50%; top: 0;
    transform: translateX(-50%);
    z-index: 3;
    width: 118px; height: 190px;
  }
  .idol .i-hair {
    position: absolute;
    left: 50%; top: 2px;
    transform: translateX(-50%);
    width: 112px; height: 142px;
    background: linear-gradient(180deg, #35245C 0%, #57408F 85%);
    border-radius: 56px 56px 34px 34px;
  }
  .idol .i-face {
    position: absolute;
    left: 50%; top: 22px;
    transform: translateX(-50%);
    width: 58px; height: 60px;
    background: linear-gradient(180deg, #FFEDE0 0%, #FFE3D0 100%);
    border-radius: 48% 48% 46% 46%;
  }
  .idol .i-bangs {
    position: absolute;
    left: 50%; top: 12px;
    transform: translateX(-50%);
    width: 70px; height: 30px;
    background: #46307A;
    border-radius: 35px 35px 42% 42%;
  }
  .idol .i-bangs::before, .idol .i-bangs::after {
    content: "";
    position: absolute;
    top: 16px;
    width: 10px; height: 34px;
    background: #46307A;
    border-radius: 0 0 8px 8px;
  }
  .idol .i-bangs::before { left: -2px; transform: rotate(4deg); }
  .idol .i-bangs::after { right: -2px; transform: rotate(-4deg); }
  .idol .i-face .e {
    position: absolute;
    top: 22px;
    width: 17px; height: 19px;
    background: radial-gradient(circle at 35% 28%, #E48BE0 0 28%, #7E32A6 75%, #4C1B68);
    border-radius: 50%;
    box-shadow: inset 0 1.5px 0 rgba(30,10,50,.55);
  }
  .idol .i-face .e.l { left: 7px; }
  .idol .i-face .e.r { right: 7px; }
  .idol .i-face .e::after {
    content: "✦";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -52%);
    font-size: 12.5px;
    color: #FFF;
    line-height: 1;
    text-shadow: 0 0 4px rgba(255,182,236,.9);
  }
  .idol .i-face .mouth {
    position: absolute;
    left: 50%; top: 45px;
    transform: translateX(-50%);
    width: 11px; height: 6px;
    border-bottom: 2.5px solid #B4506B;
    border-radius: 0 0 12px 12px;
  }
  .idol .i-face .mouth::after {
    content: "";
    position: absolute;
    left: 50%; top: 4px;
    transform: translateX(-50%);
    width: 6px; height: 5px;
    background: #F27FA5;
    border-radius: 0 0 6px 6px;
  }
  .idol .i-face .blush {
    position: absolute;
    top: 41px;
    width: 10px; height: 5px;
    background: rgba(255,128,168,.5);
    border-radius: 50%;
  }
  .idol .i-face .blush.l { left: 3px; }
  .idol .i-face .blush.r { right: 3px; }
  .idol .i-lock {
    position: absolute;
    top: 62px;
    width: 13px; height: 80px;
    background: linear-gradient(180deg, #46307A 0%, #5A3F92 100%);
    border-radius: 7px;
    z-index: 1;
  }
  .idol .i-lock.l { left: 13px; }
  .idol .i-lock.r { right: 13px; }
  .idol .i-rabbit {
    position: absolute;
    left: 12px; top: 2px;
    width: 17px; height: 15px;
    background: #F7E08E;
    border-radius: 50%;
    z-index: 2;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
  }
  .idol .i-rabbit::before, .idol .i-rabbit::after {
    content: "";
    position: absolute;
    top: -8px;
    width: 6px; height: 11px;
    background: #F7E08E;
    border-radius: 50%;
  }
  .idol .i-rabbit::before { left: 2px; transform: rotate(-14deg); }
  .idol .i-rabbit::after { right: 2px; transform: rotate(14deg); }

<script>
  var HEADS = {

    trio: '<div class="trio"><div class="dig a"><i class="e l"></i><i class="e r"></i><b class="nose"></b></div><div class="dig b"><i class="e l"></i><i class="e r"></i><b class="nose"></b></div><div class="dig c"><i class="e l"></i><i class="e r"></i><b class="nose"></b></div></div>',

  };

  var BRIDES = [
    {
      species: "전설의 아이돌", name: "아짱", head: "idol", rarity: "ssr", gown: "rose", noTiara: true,
      extra: '<span class="ai-heart">♥</span>',
      quote: "“오늘 예식의 세트리스트는 단 한 곡, ‘평생’입니다. 사랑해요… 이번엔 아마 진심!”",
      skill: "하객 전원을 3분 만에 팬클럽으로 개종",
      caution: "눈 속의 별 때문에 웨딩 사진마다 렌즈 플레어 발생"
    },
    {
      species: "두더지", name: "두덕순", head: "mole", rarity: "n",
      quote: "“지하 30m 신혼집 마련 완료. 채광은 없지만 방음은 완벽해요.”",
      skill: "3초 만에 땅굴 비상구 확보",
      caution: "예식 도중 부끄러우면 버진로드를 파고 사라짐"
    },
    {
      species: "세쌍둥이 두더지", name: "디그순 자매", head: "trio", rarity: "sr",
      quote: "“셋이서 하나예요. 반지는 세 개, 축의금은 세 배로 부탁드려요.”",
      skill: "금발 웨이브는 타고난 것 (재질: 강철, 드라이 불가)",
      caution: "정확히 누구와 결혼하는 건지는 본인들도 모름"
    },
    {
      species: "정체불명의 악당 미녀", name: "로사린", head: "rocket", rarity: "sr",
      extra: '<span class="r-logo">R</span>',
      quote: "“이 결혼을 방해하는 자, 그게 누구든 용서하지 않겠어~!”",
      skill: "어디서든 흰 연기와 함께 3단 포즈로 등장",
      caution: "혼인신고서를 자꾸 ‘비밀 작전 서류’라고 부름"
    },
    {
      species: "매운맛 닭", name: "호치롱", head: "chick", rarity: "r",
      quote: "“매운 거 못 드시는 신랑은… 음, 조금 곤란한데요.”",
      skill: "주례사 도중 소스를 꺼내 비비기 시작함",
      caution: "피로연 메뉴가 전부 극한의 매운맛 (사전 고지 없음)"
    },
    {
      species: "식빵", name: "식순이", head: "bread", rarity: "n",
      quote: "“매일 아침 갓 구운 버터 향으로 깨워 드릴게요.”",
      skill: "어떤 잼과도 잘 어울리는 원만한 성격",
      caution: "야외 예식 시 비둘기 하객 200마리 난입 예정"
    }
  ];

  var RARITY = {
    n:   { label: "N · 노말", weight: 42 },
    r:   { label: "R · 레어", weight: 30 },
    sr:  { label: "SR · 슈퍼레어", weight: 20 },
    ssr: { label: "★ 전설의 신부 ★", weight: 8 }
  };

  var boxScene = document.getElementById("boxScene");
  var cardScene = document.getElementById("cardScene");
  var giftbox = document.getElementById("giftbox");
  var card = document.getElementById("card");
  var toastEl = document.getElementById("toast");
  var reduceMotion = false;
  try { reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  var lastPick = null;
  var busy = false;

  function pickBride() {
    var pool = BRIDES.filter(function (b) { return b !== lastPick; });
    var total = pool.reduce(function (s, b) { return s + RARITY[b.rarity].weight; }, 0);
    var roll = Math.random() * total;
    for (var i = 0; i < pool.length; i++) {
      roll -= RARITY[pool[i].rarity].weight;
      if (roll <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function figureHTML(b, mini) {
    return '<div class="bride' + (mini ? ' mini' : '') + '">' +
      '<div class="veil"></div>' +
      (b.noTiara ? '' : '<span class="tiara">👑</span>') +
      HEADS[b.head] +
      '<div class="gown' + (b.gown ? ' ' + b.gown : '') + '"></div>' +
      (b.extra || '') +
      '<span class="bouquet">💐</span>' +
    '</div>';
  }

  function renderCard(b) {
    card.className = "card" + (b.rarity === "ssr" ? " ssr" : "");
    card.innerHTML =
      '<span class="rarity ' + b.rarity + '">' + RARITY[b.rarity].label + '</span>' +
      figureHTML(b, false) +
      '<h2 class="bride-name">' + b.name + '</h2>' +
      '<p class="bride-species">' + b.species + ' 신부</p>' +
      '<p class="bride-quote">' + b.quote + '</p>' +
      '<div class="bride-meta">' +
        '<div><b>특기</b> ' + b.skill + '</div>' +
        '<div><b>주의</b> ' + b.caution + '</div>' +
      '</div>';
  }

  var gallery = document.getElementById("gallery");
  var galleryBuilt = false;

  function openGallery() {
    if (!galleryBuilt) {
      var order = { ssr: 0, sr: 1, r: 2, n: 3 };
      var sorted = BRIDES.slice().sort(function (a, b) { return order[a.rarity] - order[b.rarity]; });
      document.getElementById("galleryList").innerHTML = sorted.map(function (b) {
        return '<div class="g-item' + (b.rarity === "ssr" ? ' ssr' : '') + '">' +
          '<div class="g-fig">' + figureHTML(b, true) + '</div>' +
          '<div class="g-info">' +
            '<span class="rarity ' + b.rarity + '">' + RARITY[b.rarity].label + '</span>' +
            '<h3>' + b.name + '<small>' + b.species + ' 신부</small></h3>' +
            '<p class="g-quote">' + b.quote + '</p>' +
            '<p class="g-line"><b>특기</b> ' + b.skill + '</p>' +
            '<p class="g-line"><b>주의</b> ' + b.caution + '</p>' +
          '</div></div>';
      }).join('');
      galleryBuilt = true;
    }
    gallery.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeGallery() {
    gallery.hidden = true;
    document.body.style.overflow = "";
  }

  function draw() {
    if (busy) return;
    busy = true;
    if (giftbox) giftbox.classList.add("shaking");
    var delay = reduceMotion ? 0 : 850;
    setTimeout(function () {
      if (giftbox) giftbox.classList.remove("shaking");
      var b = pickBride();
      lastPick = b;
      renderCard(b);
      boxScene.style.display = "none";
      cardScene.hidden = false;
      try { card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }); } catch (e) {}
      try { fireConfetti(b.rarity === "ssr"); } catch (e) {}
      busy = false;
    }, delay);
  }

  function resetToBox() {
    cardScene.hidden = true;
    boxScene.style.display = "";
  }

  function copyLink() {
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showToast("링크 복사 완료! 친구에게 운명을 전하세요 💌");
      }, function () {
        showToast("복사에 실패했어요. 주소창의 링크를 직접 복사해 주세요.");
      });
    } else {
      showToast("복사가 지원되지 않아요. 주소창의 링크를 직접 복사해 주세요.");
    }
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest("#giftBtn")) draw();
    else if (t.closest("#againBtn")) resetToBox();
    else if (t.closest("#shareBtn")) copyLink();
    else if (t.closest("#galleryBtn")) openGallery();
    else if (t.closest("#galleryClose") || t.closest("#galleryBackdrop")) closeGallery();
  });

  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.id === "giftBtn") {
      e.preventDefault();
      draw();
    }
    if (e.key === "Escape" && !gallery.hidden) closeGallery();
  });

  var toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  /* ---------- confetti ---------- */
  var canvas = document.getElementById("confetti");
  var ctx = null;
  var particles = [];
  var rafId = null;

  try {
    ctx = canvas.getContext("2d");
    var resize = function () {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    };
    addEventListener("resize", resize);
    resize();
  } catch (e) { ctx = null; }

  function fireConfetti(isSSR) {
    if (reduceMotion || !ctx) return;
    var colors = isSSR
      ? ["#E4A93C", "#F6D488", "#FFF3D0", "#FF4D8D", "#FFFFFF"]
      : ["#FF4D8D", "#FF97BF", "#FFFFFF", "#F6D488", "#B58CE0"];
    var cx = innerWidth / 2, cy = innerHeight * 0.42;
    var count = isSSR ? 160 : 100;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 8;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 5 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1
      });
    }
    if (!rafId) tick();
  }

  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(function (p) { return p.life > 0; });
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22;
      p.vx *= 0.985;
      p.rot += p.vr;
      p.life -= 0.011;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }
    if (particles.length) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }
</script>
